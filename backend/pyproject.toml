[project]
name = "backend"
version = "0.1.0"
description = "QueueStorm Investigator backend — AI/API SupportOps copilot."
readme = "RUNBOOK.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.138.1",
    "google-genai>=2.10.0",
    "groq>=1.5.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.router", "app.services"]
